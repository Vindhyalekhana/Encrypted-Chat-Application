<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Encrypted Chat</title>

    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>

  <body>
    <main class="app-container">
      <header class="app-header">
        <div>
          <h1>Encrypted Chat</h1>
          <p>Private messaging interface</p>
        </div>

        <span id="connectionStatus" class="status offline"> Disconnected </span>
      </header>

      <section id="authSection" class="panel">
        <h2 id="authTitle">Welcome back</h2>

        <form id="authForm">
          <label for="username">Username</label>

          <input
            id="username"
            name="username"
            type="text"
            minlength="3"
            maxlength="32"
            autocomplete="username"
            required
          />

          <label for="password">Password</label>

          <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            autocomplete="current-password"
            required
          />

          <button id="submitButton" type="submit">Sign in</button>
        </form>

        <button id="toggleAuth" class="secondary-button" type="button">
          Create an account
        </button>

        <p id="authMessage" class="message" role="status"></p>
      </section>

      <section id="chatSection" class="chat-layout hidden">
        <aside class="panel sidebar">
          <div class="sidebar-heading">
            <h2>Conversations</h2>
            <button id="logoutButton" class="secondary-button">Sign out</button>
          </div>

          <p id="currentUser"></p>

          <label for="recipient">Recipient username</label>

          <input
            id="recipient"
            type="text"
            maxlength="32"
            placeholder="Enter username"
          />

          <button id="selectRecipient" type="button">Open conversation</button>

          <p id="chatMessage" class="message" role="status"></p>
        </aside>

        <section class="panel conversation">
          <div class="conversation-heading">
            <h2 id="conversationTitle">Select a conversation</h2>
          </div>

          <div
            id="messages"
            class="messages"
            aria-live="polite"
            aria-label="Messages"
          >
            <p class="empty-state">Select a recipient to begin.</p>
          </div>

          <form id="messageForm" class="message-form">
            <input
              id="messageInput"
              type="text"
              maxlength="4000"
              placeholder="Type a message..."
              autocomplete="off"
              required
            />

            <button type="submit">Send</button>
          </form>
        </section>
      </section>

      <footer>
        <p>Encrypted Chat Application · Academic Project</p>
      </footer>
    </main>
  </body>
</html>
